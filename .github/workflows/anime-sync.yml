name: Sync anime tracker

on:
  schedule:
    # 每天北京时间 00:23 查询一次（GitHub 定时任务可能有少量延迟）
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-tracker-sync
  cancel-in-progress: true

jobs:
  sync:
    # This scheduled refresh is optional maintenance. External API outages must
    # never turn the website's deployment status red.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch anime schedules
        id: anime_schedules
        run: node .github/scripts/sync-anime.mjs
      - name: Fetch high-rated Bangumi broadcasts
        run: node .github/scripts/sync-bangumi.mjs
      - name: Build factual Bangumi anime series catalog
        run: node .github/scripts/sync-anime-series.mjs
      - name: Validate factual anime series catalog
        run: node .github/scripts/validate-anime-series.mjs
      - name: Extract anime reviews from blog
        run: node .github/scripts/extract-anime-blog-reviews.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/anime-tracker.json public/data/anime-series-catalog.json public/data/bangumi-airing*.json public/data/bangumi-subject-index.json public/data/anime-blog-reviews.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync anime tracker"
          git push
      - name: Report maintenance result
        if: always()
        run: |
          echo "## Anime sync" >> "$GITHUB_STEP_SUMMARY"
          echo "AniList refresh: ${{ steps.anime_schedules.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This maintenance job is non-blocking and never gates GitHub Pages deployment." >> "$GITHUB_STEP_SUMMARY"
