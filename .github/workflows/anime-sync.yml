name: Sync anime tracker

on:
  schedule:
    # 每天北京时间 00:23 查询一次（GitHub 定时任务可能有少量延迟）
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-tracker-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch anime schedules
        run: node .github/scripts/sync-anime.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/anime-tracker.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync anime tracker"
          git push
