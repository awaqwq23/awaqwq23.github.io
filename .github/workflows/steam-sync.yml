name: Sync Steam library

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-library-sync
  cancel-in-progress: true

jobs:
  sync:
    # Steam is an optional data refresh and must not gate website deployment.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch Steam library
        run: node .github/scripts/sync-steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: '76561198825902593'
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/materials/steam-library.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync Steam library"
          git push
